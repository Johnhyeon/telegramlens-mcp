name: Release

# 태그 푸시(v*) 시 자동:
# 1. Python 빌드 (wheel + sdist)
# 2. PyPI 업로드
# 3. GitHub Release 생성 + dist 자산 첨부

on:
  push:
    tags:
      - 'v*'  # v0.1.0, v0.2.0 등

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # GitHub Release 생성용
      id-token: write  # PyPI Trusted Publishing (OIDC) 용
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify version matches tag
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          PKG_VER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG_VER" != "$PKG_VER" ]; then
            echo "::error::Tag version ($TAG_VER) does not match pyproject.toml version ($PKG_VER)"
            exit 1
          fi
          echo "Version OK: $PKG_VER"

      - name: Verify patch notes exist for this tag
        run: python .github/check_patchnotes.py "${GITHUB_REF_NAME#v}"

      - name: Build distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify distribution
        run: |
          python -m pip install --upgrade twine
          twine check dist/*

      # Trusted Publishing (OIDC) — 토큰 불필요. PyPI 측 pending publisher 등록 필요.
      # https://docs.pypi.org/trusted-publishers/
      #   PyPI Project Name: telegramlens-mcp / Owner: Johnhyeon
      #   Repository: telegramlens-mcp / Workflow: release.yml / Environment: (비움)
      # 배포하기 전에, 깨끗한 환경에 방금 만든 패키지를 설치해 서버가 실제로 뜨는지 본다.
      #
      # 개발 PC에는 옛 의존성이 남아 있어 "여기선 되는데"를 못 잡는다. 실제로 mcp 2.0.0에서
      # mcp.server.fastmcp가 사라졌을 때, 상한 없이 나간 패키지를 새로 설치한 사람은 서버가
      # import 단계에서 죽었는데 개발 PC에는 옛 mcp가 남아 있어 아무도 몰랐다 — 구매자가
      # 먼저 겪었다. 이 단계가 있었으면 릴리스 전에 걸렸다.
      - name: 깨끗한 환경에서 서버 기동 확인
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install --quiet --upgrade pip
          # --no-cache-dir: 의존성을 새로 풀어 "오늘 처음 설치하는 사람"과 같은 조건을 만든다.
          /tmp/verify/bin/pip install --quiet --no-cache-dir dist/*.whl
          echo "── 실제로 깔린 의존성 ──"
          /tmp/verify/bin/pip list
          # MCP 서버는 stdin이 닫히면 정상 종료한다. 못 뜨면 트레이스백을 남기고 죽는다.
          set +e
          /tmp/verify/bin/telegramlens < /dev/null > /tmp/verify_out.log 2> /tmp/verify_err.log
          code=$?
          set -e
          if [ "$code" -ne 0 ] || grep -q "Traceback" /tmp/verify_err.log; then
            echo "::error::깨끗한 환경에서 서버가 뜨지 않습니다 (종료 코드 $code) — 배포를 중단합니다"
            cat /tmp/verify_err.log
            exit 1
          fi
          echo "서버 기동 OK"

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
          body: |
            TelegramLens — 텔레그램 채널의 종목 내러티브·언급 흐름을 구조화해
            AI에게 전달하는 로컬 MCP 서버.

            설치·활성화는 구매자 안내문 기준으로 진행합니다.
            유효한 라이선스 키가 있어야 도구가 동작합니다(`telegramlens-activate`).
